# Docker Compose for NexusAI
# PostgreSQL Database Only (ChromaDB runs locally in venv)

services:
  # ===========================================
  # PostgreSQL Database
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: nexusai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexusai
      POSTGRES_PASSWORD: nexusai_password
      POSTGRES_DB: nexusai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

