# Docker Compose for NexusAI
# PostgreSQL Database Only (ChromaDB runs locally in venv)

services:
  # ===========================================
  # PostgreSQL Database
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: nexusai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexusai
      POSTGRES_PASSWORD: nexusai_password
      POSTGRES_DB: nexusai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===========================================
  # Redis - Message Broker for WebSockets
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: nexusai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ===========================================
  # Notification Service - Standalone Socket Server
  # ===========================================
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.notification
    container_name: nexusai-notifications
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=khe_nhat_fpt
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:

