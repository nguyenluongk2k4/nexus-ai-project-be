services:
  # ---------------------------------------------------------------------------
  # Database Service (PostgreSQL)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:17-alpine
    container_name: nexusai-db
    environment:
      - POSTGRES_USER=nexusai
      - POSTGRES_PASSWORD=nexusai_password
      - POSTGRES_DB=nexusai
    volumes:
      - ../postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusai"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - nexusai-network

  # ---------------------------------------------------------------------------
  # Vector Database (ChromaDB)
  # ---------------------------------------------------------------------------
  chromadb:
    image: chromadb/chroma:latest
    container_name: nexusai-chromadb
    volumes:
      - ../chroma_db:/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
      - ANONYMIZED_TELEMETRY=False
    ports:
      - "8001:8000"
    restart: always
    networks:
      - nexusai-network

  # ---------------------------------------------------------------------------
  # Message Broker (Redis)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nexusai-redis
    volumes:
      - ../redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - nexusai-network

  # ---------------------------------------------------------------------------
  # Backend Service (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexusai-backend
    depends_on:
      db:
        condition: service_healthy
      chromadb:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://nexusai:nexusai_password@nexusai-db:5432/nexusai
      - CHROMA_MODE=server
      - CHROMA_HOST=nexusai-chromadb
      - CHROMA_PORT=8000
      - REDIS_URL=redis://nexusai-redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-khe_nhat_fpt}
      - DEBUG=True
      - API_BASE_URL=${API_BASE_URL:-https://nexusai.vn}
      - FRONTEND_URL=${FRONTEND_URL:-https://nexusai.vn}
      - BASE_URL=${BASE_URL:-https://nexusai.vn}
    volumes:
      - ./data:/app/data
      - ./static/uploads:/app/static/uploads
    networks:
      - nexusai-network
    restart: on-failure

networks:
  nexusai-network:
    name: nexusai-network
    driver: bridge
